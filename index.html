<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信 Windows 历史版本下载</title>
    <style>
        /* ============================================================
           设计语言取自「阿汪」设置页（字节 Arco 明亮风）：
           token 与阿汪 settings.css 一致；界面做减法，不堆装饰、不发光。
           ============================================================ */
        :root {
            --text-1: #1d2129;
            --text-2: #4e5969;
            --text-3: #86909c;
            --border: #e5e6eb;
            --border-strong: #d9d9d9;
            --fill: #f2f3f5;
            --page: #f7f8fa;
            --primary: #165dff;
            --primary-hover: #0e42d2;
            --primary-soft: rgba(22, 93, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei',
                system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-1);
            background: var(--page);
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 44px 24px 60px;
        }

        /* ---------------------------------------------------------- 页头 */
        .page-head {
            margin-bottom: 24px;
        }

        .page-head h1 {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-1);
            letter-spacing: 0.3px;
        }

        .page-head .sub {
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-3);
        }

        /* ---------------------------------------------------------- 说明块（阿汪 .note） */
        .note {
            margin-bottom: 26px;
            padding: 12px 14px;
            font-size: 12.5px;
            line-height: 1.7;
            color: var(--text-2);
            background: var(--fill);
            border-radius: 8px;
        }

        .note a {
            color: var(--primary);
            text-decoration: none;
        }

        .note a:hover {
            text-decoration: underline;
        }

        /* ---------------------------------------------------------- 统计卡片（阿汪 .stat-card） */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .stat {
            padding: 16px 18px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .stat .k {
            font-size: 12px;
            color: var(--text-3);
        }

        .stat .v {
            margin-top: 6px;
            font-size: 22px;
            font-weight: 600;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
        }

        /* ---------------------------------------------------------- 版本卡片（阿汪 .card） */
        .release {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            margin-bottom: 14px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .release:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 10px var(--primary-soft);
        }

        .release .ver {
            flex: none;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
        }

        .release .meta {
            flex: 1;
            min-width: 0;
            font-size: 12.5px;
            color: var(--text-3);
        }

        .release .meta .date {
            color: var(--text-2);
        }

        .release .sha {
            margin-top: 3px;
            font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace;
            font-size: 11px;
            color: var(--text-3);
            word-break: break-all;
        }

        /* ---------------------------------------------------------- 按钮（阿汪 primary / secondary） */
        .actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 18px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn-primary {
            color: #fff;
            background: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn-ghost {
            color: var(--text-1);
            background: #fff;
            border: 1px solid var(--border-strong);
        }

        .btn-ghost:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ---------------------------------------------------------- 状态 */
        .loading {
            padding: 40px 0;
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
        }

        .error {
            padding: 24px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #f53f3f;
            font-size: 13px;
        }

        /* ---------------------------------------------------------- 页脚 */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            line-height: 1.8;
            color: var(--text-3);
            text-align: center;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .release {
                flex-wrap: wrap;
            }

            .actions {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="page-head">
            <h1>微信 Windows 历史版本</h1>
            <div class="sub">各版本安装包一键下载 · GitHub Actions 每日自动归档</div>
        </div>

        <div class="note">
            数据来源：微信官网 <a href="https://pc.weixin.qq.com/" target="_blank">pc.weixin.qq.com</a>
            ；仓库：<a href="https://github.com/feiwenqiang/weChatOldExe" target="_blank">GitHub · feiwenqiang/weChatOldExe</a>。
            安装包版权归腾讯所有，本页仅作个人存档用途。
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat">
                <div class="k">版本总数</div>
                <div class="v" id="total">0</div>
            </div>
            <div class="stat">
                <div class="k">最新版本</div>
                <div class="v" id="latest">-</div>
            </div>
            <div class="stat">
                <div class="k">最后更新</div>
                <div class="v" id="updated">-</div>
            </div>
        </div>

        <div id="list">
            <div class="loading" id="loading">正在获取版本列表…</div>
        </div>

        <div class="footer">
            安装包版权归腾讯所有 · Powered by GitHub Pages<br>
            <a href="https://github.com/feiwenqiang/weChatOldExe" target="_blank">在 GitHub 上查看</a>
        </div>
    </div>

    <script>
        const releasesUrl = './releases.json';

        async function fetchReleases() {
            try {
                const response = await fetch(releasesUrl, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                const releases = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats').style.display = 'grid';

                if (releases.length === 0) {
                    document.getElementById('list').innerHTML =
                        '<div class="error">暂无可用版本（Actions 还没跑过第一次）</div>';
                    return;
                }

                document.getElementById('total').textContent = releases.length;
                const latest = releases[0];
                document.getElementById('latest').textContent = latest.tag_name.replace('v', '');
                document.getElementById('updated').textContent =
                    new Date(latest.published_at).toLocaleDateString('zh-CN');

                renderReleases(releases);
            } catch (error) {
                document.getElementById('loading').innerHTML =
                    '<div class="error">加载失败：' + error.message + '</div>';
                console.error('Error fetching releases:', error);
            }
        }

        function renderReleases(releases) {
            const list = document.getElementById('list');
            list.innerHTML = '';

            releases.forEach(release => {
                const version = release.tag_name.replace('v', '');
                const date = new Date(release.published_at).toLocaleDateString('zh-CN');
                const body = release.body || '';
                const sha = extractValue(body, 'Sha256');
                const exeAsset = release.assets.find(asset => asset.name.endsWith('.exe'));

                const item = document.createElement('div');
                item.className = 'release';

                item.innerHTML = `
                    <div class="ver">v${version}</div>
                    <div class="meta">
                        <div class="date">发布于 ${date}</div>
                        ${sha ? `<div class="sha">SHA256: ${sha}</div>` : ''}
                    </div>
                    ${exeAsset ? `
                        <div class="actions">
                            <a href="${exeAsset.browser_download_url}" class="btn btn-primary">
                                ⬇ 下载 ${formatBytes(exeAsset.size)}
                            </a>
                            <a href="${release.html_url}" target="_blank" class="btn btn-ghost">
                                查看
                            </a>
                        </div>
                    ` : ''}
                `;

                list.appendChild(item);
            });
        }

        function extractValue(text, key) {
            const regex = new RegExp(`${key}:\\s*([^\\n]+)`, 'i');
            const match = text.match(regex);
            return match ? match[1].trim() : null;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        fetchReleases();
    </script>
</body>
</html>
