<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微信 Windows 安装包归档 · 阿汪</title>
<style>
  :root {
    --bg: #050607;
    --text: #f5f7fa;
    --text-2: #a7adb8;
    --text-3: #6b7280;
    --accent: #378add;
    --line: rgba(255, 255, 255, .08);
    --card: rgba(255, 255, 255, .035);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    position: relative;
    padding: 0 0 64px;
  }
  /* 阿汪官网同款顶部蓝色光辉 */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 90vh;
    background: radial-gradient(620px 380px at 50% 0%, rgba(55, 138, 221, .20), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---- 顶部品牌区 ---- */
  header {
    text-align: center;
    padding: 64px 0 14px;
    animation: rise .9s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pup { width: 120px; height: auto; display: block; margin: 0 auto 22px; overflow: visible; }
  .pup .dog { animation: pant 2.1s ease-in-out infinite; transform-origin: 80px 150px; }
  @keyframes pant {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.012); }
  }
  .pup .tail { animation: wag .85s ease-in-out infinite alternate; transform-origin: 114px 122px; }
  @keyframes wag {
    from { transform: rotate(-11deg); }
    to { transform: rotate(13deg); }
  }
  .pup .tongue { animation: lick 1.6s ease-in-out infinite; transform-origin: 80px 88px; }
  @keyframes lick {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(.82); }
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.35;
  }
  .sub {
    margin-top: 10px;
    font-size: 14.5px;
    color: var(--text-2);
  }
  .sub b { color: #fff; font-weight: 500; }

  /* ---- 统计条 ---- */
  .stats {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 28px 0 8px;
    animation: rise 1s cubic-bezier(.16, 1, .3, 1) both;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 22px;
    text-align: center;
    min-width: 132px;
  }
  .stat b {
    display: block;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .stat span { font-size: 12.5px; color: var(--text-3); margin-top: 3px; display: block; }

  /* ---- 列表 ---- */
  .list { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
    animation: rise 1s cubic-bezier(.16, 1, .3, 1) both;
  }
  .card:hover {
    border-color: rgba(55, 138, 221, .55);
    background: rgba(55, 138, 221, .06);
    transform: translateY(-2px);
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ver { font-size: 19px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
  .meta { font-size: 13px; color: var(--text-3); margin-top: 4px; }
  .badge {
    font-size: 12px;
    font-weight: 500;
    color: #cfe3ff;
    background: rgba(55, 138, 221, .16);
    border: 1px solid rgba(55, 138, 221, .4);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .sha {
    margin-top: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--text-2);
    background: rgba(255, 255, 255, .04);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    word-break: break-all;
  }
  .sha .k { color: var(--text-3); margin-right: 6px; }
  .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 9px;
    padding: 9px 16px;
    transition: background .18s ease, border-color .18s ease, opacity .18s ease;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: #4a98e8; }
  .btn.ghost { background: transparent; color: var(--text-2); border: 1px solid rgba(255, 255, 255, .18); }
  .btn.ghost:hover { color: #fff; border-color: rgba(255, 255, 255, .4); }

  .empty, .err { text-align: center; color: var(--text-3); padding: 40px 0; font-size: 14px; }
  .err { color: #ff8a80; }

  footer {
    position: fixed;
    bottom: 22px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    z-index: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    header, .stats, .card { animation: none; }
    .pup .dog, .pup .tail, .pup .tongue { animation: none; }
  }
  @media (max-width: 480px) {
    .pup { width: 100px; }
    .stat { min-width: 108px; padding: 12px 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg class="pup" viewBox="0 0 160 162" role="img" aria-label="阿汪吉祥物">
        <ellipse cx="80" cy="159" rx="44" ry="5" fill="rgba(255,255,255,.07)" />
        <g class="dog">
          <path class="tail" d="M106 108 C126 104 136 92 131 81" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" />
          <rect x="54" y="132" width="17" height="28" rx="8.5" fill="#fff" />
          <rect x="89" y="132" width="17" height="28" rx="8.5" fill="#fff" />
          <ellipse cx="80" cy="118" rx="34" ry="29" fill="#fff" />
          <ellipse class="ear l" cx="34" cy="60" rx="14" ry="25" fill="#fff" transform="rotate(-18 34 60)" />
          <ellipse class="ear r" cx="126" cy="60" rx="14" ry="25" fill="#fff" transform="rotate(18 126 60)" />
          <circle cx="80" cy="62" r="42" fill="#fff" />
          <path d="M55 96 Q80 107 105 96" fill="none" stroke="#378add" stroke-width="8.5" stroke-linecap="round" />
          <ellipse cx="50" cy="78" rx="7.5" ry="4.8" fill="rgba(255,140,140,.42)" />
          <ellipse cx="110" cy="78" rx="7.5" ry="4.8" fill="rgba(255,140,140,.42)" />
          <circle cx="64" cy="58" r="5.6" fill="#0b0d10" />
          <circle cx="66" cy="55.8" r="1.8" fill="#fff" />
          <circle cx="96" cy="58" r="5.6" fill="#0b0d10" />
          <circle cx="98" cy="55.8" r="1.8" fill="#fff" />
          <ellipse cx="80" cy="78" rx="7" ry="5.4" fill="#0b0d10" />
          <path d="M80 84 v3" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" />
          <path d="M80 87 q-7 6 -12 1" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" />
          <path d="M80 87 q7 6 12 1" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round" />
          <ellipse class="tongue" cx="80" cy="96" rx="6.5" ry="8" fill="#ff8a80" />
        </g>
      </svg>
      <h1>微信 Windows 安装包归档</h1>
      <p class="sub">阿汪出品 · 历史版本留存，<b>自动追踪官网更新</b></p>
    </header>

    <div class="stats" id="stats"></div>
    <div class="list" id="list">
      <div class="empty">正在加载版本列表…</div>
    </div>
  </div>

  <footer>阿汪 · Windows 桌面小工具</footer>

  <script>
    const $ = (id) => document.getElementById(id);

    function fmtDate(s) {
      if (!s) return "—";
      const d = new Date(s);
      if (isNaN(d)) return "—";
      return d.toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
    }
    function fmtSize(b) {
      if (!b) return "";
      if (b < 1024 * 1024) return (b / 1024).toFixed(0) + " KB";
      return (b / 1024 / 1024).toFixed(1) + " MB";
    }
    function pickExe(assets) {
      return (assets || []).find((a) => /\.exe$/i.test(a.name)) || null;
    }
    function pickSha(body) {
      if (!body) return null;
      const m = body.match(/SHA256[:：]\s*([0-9a-fA-F]{64})/);
      return m ? m[1] : null;
    }

    function render(arr) {
      const sorted = arr
        .slice()
        .sort((a, b) => new Date(b.published_at || 0) - new Date(a.published_at || 0));

      const latest = sorted[0];
      const lastUpd = fmtDate(latest.published_at);
      $("stats").innerHTML = [
        { n: sorted.length, l: "归档版本" },
        { n: latest.tag_name || "—", l: "最新版本" },
        { n: lastUpd, l: "最后更新" },
      ]
        .map(
          (s) =>
            '<div class="stat"><b>' + s.n + "</b><span>" + s.l + "</span></div>"
        )
        .join("");

      $("list").innerHTML = sorted
        .map((r, i) => {
          const exe = pickExe(r.assets);
          if (!exe) return "";
          const sha = pickSha(r.body);
          const meta =
            "发布 " + fmtDate(r.published_at) + (exe.size ? " · " + fmtSize(exe.size) : "");
          const shaHtml = sha
            ? '<div class="sha"><span class="k">SHA256</span>' + sha + "</div>"
            : "";
          const badge = i === 0 ? '<span class="badge">最新</span>' : "";
          return (
            '<article class="card">' +
            '<div class="card-top"><div><div class="ver">' +
            r.tag_name +
            '</div><div class="meta">' +
            meta +
            "</div></div>" +
            badge +
            "</div>" +
            shaHtml +
            '<div class="actions">' +
            '<a class="btn primary" href="' +
            exe.browser_download_url +
            '" download>下载安装包</a>' +
            '<a class="btn ghost" href="' +
            (r.html_url || "#") +
            '" target="_blank" rel="noopener">查看详情</a>' +
            "</div></article>"
          );
        })
        .join("");
    }

    function showError(msg) {
      $("list").innerHTML = '<div class="err">' + msg + "</div>";
    }

    async function load() {
      try {
        const res = await fetch("./releases.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) {
          $("list").innerHTML = '<div class="empty">暂无归档版本。</div>';
          return;
        }
        render(arr);
      } catch (e) {
        showError("版本列表加载失败：" + e.message + "（稍后重试或检查 releases.json）");
      }
    }

    load();
  </script>
</body>
</html>
